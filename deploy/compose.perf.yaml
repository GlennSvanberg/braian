# CPU pins for a perf or deploy host with 8 vCPUs.
# Dev `just up` does not load this file.
#
#   docker compose -f compose.yaml -f deploy/compose.perf.yaml up -d postgres typesense
#
# Cores 0-2 Postgres, 3 Braian (taskset on the host), 4 free, 5 the load
# generator, 6-7 Typesense. See docs/dev.md.
#
# On this pin Typesense has two threads. Bulk import concurrency defaults
# to 1 so one thread stays free for an interactive upsert. Set
# BRAIAN_INDEXER_BULK_IMPORT_CONCURRENCY=2 to use both while catching up;
# the indexer still drops to one batch of at most 100 documents while
# interactive events or API requests are in flight. The value is capped at 2.
# BRAIAN_POOL_BULK defaults to 8. Set 12 when the host should spend the
# quiet intervals on import throughput. perf-load reads that variable.
# Bulk writers yield while interactive requests are in flight, including
# requests handled by another process (BRAIAN_BULK_YIELD_MAX_MS).

services:
  postgres:
    cpuset: "0,1,2"
    cpus: 3.0

  typesense:
    cpuset: "6,7"
    cpus: 2.0
    command:
      - --data-dir=/data
      - --api-key=${TYPESENSE_API_KEY:?sätt i .env}
      - --enable-cors
      - --thread-pool-size=2

  # Optional. Build or tag an image that contains `braian-bench`, then:
  #   docker compose -f compose.yaml -f deploy/compose.perf.yaml --profile perf run --rm perf-load
  perf-load:
    profiles: ["perf"]
    image: ${BRAIAN_PERF_IMAGE:-braian-bench:local}
    cpuset: "5"
    cpus: 1.0
    network_mode: host
    entrypoint: ["braian-bench", "perf-load"]
