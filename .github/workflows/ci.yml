name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: librdkafka build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libssl-dev libcurl4-openssl-dev
          if [ ! -e /usr/include/curl ]; then sudo ln -s /usr/include/x86_64-linux-gnu/curl /usr/include/curl; fi
          if [ ! -e /usr/lib/x86_64-linux-gnu/libstdc++.so ]; then
            so=$(echo /usr/lib/gcc/x86_64-linux-gnu/*/libstdc++.so)
            sudo ln -sf "$so" /usr/lib/x86_64-linux-gnu/libstdc++.so
          fi
      - name: Start Postgres
        run: |
          cat > .env << 'EOF'
          POSTGRES_USER=braian
          POSTGRES_PASSWORD=braian
          POSTGRES_DB=braian
          POSTGRES_READONLY_PASSWORD=braian-readonly
          POSTGRES_HOST_PORT=5433
          TYPESENSE_API_KEY=ci
          DATABASE_URL=postgres://braian:braian@localhost:5433/braian
          BRAIAN_TEST_DATABASE_URL=postgres://braian:braian@localhost:5433/postgres
          EOF
          docker compose up -d --wait postgres
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
        env:
          BRAIAN_TEST_DATABASE_URL: postgres://braian:braian@localhost:5433/postgres
          DATABASE_URL: postgres://braian:braian@localhost:5433/braian
      - name: rules måste kompilera till WebAssembly
        run: cargo build -p braian-rules -p braian-rules-wasm --target wasm32-unknown-unknown

  phase-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: taiki-e/install-action@v2
        with:
          tool: just,wasm-bindgen-cli@0.2.129
      - run: just demo-1
      - run: just test-wasm

  phase-2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: librdkafka build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libssl-dev libcurl4-openssl-dev
          if [ ! -e /usr/include/curl ]; then sudo ln -s /usr/include/x86_64-linux-gnu/curl /usr/include/curl; fi
          if [ ! -e /usr/lib/x86_64-linux-gnu/libstdc++.so ]; then
            so=$(echo /usr/lib/gcc/x86_64-linux-gnu/*/libstdc++.so)
            sudo ln -sf "$so" /usr/lib/x86_64-linux-gnu/libstdc++.so
          fi
      - name: Start Postgres
        run: |
          cat > .env << 'EOF'
          POSTGRES_USER=braian
          POSTGRES_PASSWORD=braian
          POSTGRES_DB=braian
          POSTGRES_READONLY_PASSWORD=braian-readonly
          POSTGRES_HOST_PORT=5433
          TYPESENSE_API_KEY=ci
          DATABASE_URL=postgres://braian:braian@localhost:5433/braian
          BRAIAN_TEST_DATABASE_URL=postgres://braian:braian@localhost:5433/postgres
          EOF
          docker compose up -d --wait postgres
      - run: just demo-2

  phase-3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Install Hurl
        run: |
          curl -fsSL -o /tmp/hurl.tar.gz https://github.com/Orange-OpenSource/hurl/releases/download/8.0.1/hurl-8.0.1-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf /tmp/hurl.tar.gz -C /tmp
          sudo find /tmp -type f -name hurl -exec mv {} /usr/local/bin/hurl \;
          sudo chmod +x /usr/local/bin/hurl
          hurl --version
      - name: librdkafka build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libssl-dev libcurl4-openssl-dev
          if [ ! -e /usr/include/curl ]; then sudo ln -s /usr/include/x86_64-linux-gnu/curl /usr/include/curl; fi
          if [ ! -e /usr/lib/x86_64-linux-gnu/libstdc++.so ]; then
            so=$(echo /usr/lib/gcc/x86_64-linux-gnu/*/libstdc++.so)
            sudo ln -sf "$so" /usr/lib/x86_64-linux-gnu/libstdc++.so
          fi
      - name: Start Postgres
        run: |
          cat > .env << 'EOF'
          POSTGRES_USER=braian
          POSTGRES_PASSWORD=braian
          POSTGRES_DB=braian
          POSTGRES_READONLY_PASSWORD=braian-readonly
          POSTGRES_HOST_PORT=5433
          TYPESENSE_API_KEY=ci
          DATABASE_URL=postgres://braian:braian@localhost:5433/braian
          BRAIAN_TEST_DATABASE_URL=postgres://braian:braian@localhost:5433/postgres
          EOF
          docker compose up -d --wait postgres
      - run: just demo-3

  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: librdkafka build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libssl-dev libcurl4-openssl-dev
          if [ ! -e /usr/include/curl ]; then sudo ln -s /usr/include/x86_64-linux-gnu/curl /usr/include/curl; fi
          if [ ! -e /usr/lib/x86_64-linux-gnu/libstdc++.so ]; then
            so=$(echo /usr/lib/gcc/x86_64-linux-gnu/*/libstdc++.so)
            sudo ln -sf "$so" /usr/lib/x86_64-linux-gnu/libstdc++.so
          fi
      - name: Start Postgres, Redpanda and Typesense
        run: |
          cat > .env << 'EOF'
          POSTGRES_USER=braian
          POSTGRES_PASSWORD=braian
          POSTGRES_DB=braian
          POSTGRES_READONLY_PASSWORD=braian-readonly
          POSTGRES_HOST_PORT=5433
          TYPESENSE_API_KEY=ci
          DATABASE_URL=postgres://braian:braian@localhost:5433/braian
          BRAIAN_TEST_DATABASE_URL=postgres://braian:braian@localhost:5433/postgres
          KAFKA_BROKERS=localhost:19092
          TYPESENSE_URL=http://localhost:8108
          EOF
          docker compose up -d --wait postgres redpanda typesense
      - name: Relay keeps commit order across a restart
        run: cargo test -p braian-relay --test order -- --test-threads=1
        env:
          BRAIAN_TEST_DATABASE_URL: postgres://braian:braian@localhost:5433/postgres
          DATABASE_URL: postgres://braian:braian@localhost:5433/braian
          KAFKA_BROKERS: localhost:19092
      - name: Indexer converges and reindex swaps the alias
        run: cargo test -p braian-indexer --test converge -- --test-threads=1
        env:
          BRAIAN_TEST_DATABASE_URL: postgres://braian:braian@localhost:5433/postgres
          DATABASE_URL: postgres://braian:braian@localhost:5433/braian
          TYPESENSE_URL: http://localhost:8108
          TYPESENSE_API_KEY: ci
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
      - name: Playwright smoke against an isolated database
        env:
          DATABASE_URL: postgres://braian:braian@localhost:5433/braian
          POSTGRES_USER: braian
          TYPESENSE_URL: http://localhost:8108
          TYPESENSE_API_KEY: ci
          BRAIAN_DEMO_EMAIL: admin@braian.local
          BRAIAN_DEMO_PASSWORD: braian-demo
          BRAIAN_DEMO_TOKEN: braian-demo-token
          BRAIAN_AGENT_MOCK: "1"
        run: |
          cargo build -p braian-server
          pnpm install --frozen-lockfile
          pnpm --dir apps/web exec playwright install --with-deps chromium
          node scripts/e2e.mjs

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
      - name: Typecheck and unit tests
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir apps/web exec tsc --noEmit
          pnpm --dir apps/web exec vitest run
          pnpm --dir apps/landing exec tsc --noEmit
          pnpm --dir apps/landing build

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
