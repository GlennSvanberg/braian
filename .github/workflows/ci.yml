name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Start Postgres
        run: |
          cat > .env << 'EOF'
          POSTGRES_USER=openpim
          POSTGRES_PASSWORD=openpim
          POSTGRES_DB=openpim
          POSTGRES_READONLY_PASSWORD=openpim-readonly
          POSTGRES_HOST_PORT=5433
          TYPESENSE_API_KEY=ci
          DATABASE_URL=postgres://openpim:openpim@localhost:5433/openpim
          OPENPIM_TEST_DATABASE_URL=postgres://openpim:openpim@localhost:5433/postgres
          EOF
          docker compose up -d --wait postgres
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
        env:
          OPENPIM_TEST_DATABASE_URL: postgres://openpim:openpim@localhost:5433/postgres
          DATABASE_URL: postgres://openpim:openpim@localhost:5433/openpim
      - name: rules måste kompilera till WebAssembly
        run: cargo build -p openpim-rules -p openpim-rules-wasm --target wasm32-unknown-unknown

  phase-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: taiki-e/install-action@v2
        with:
          tool: just,wasm-bindgen-cli@0.2.129
      - run: just demo-1
      - run: just test-wasm

  phase-2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Start Postgres
        run: |
          cat > .env << 'EOF'
          POSTGRES_USER=openpim
          POSTGRES_PASSWORD=openpim
          POSTGRES_DB=openpim
          POSTGRES_READONLY_PASSWORD=openpim-readonly
          POSTGRES_HOST_PORT=5433
          TYPESENSE_API_KEY=ci
          DATABASE_URL=postgres://openpim:openpim@localhost:5433/openpim
          OPENPIM_TEST_DATABASE_URL=postgres://openpim:openpim@localhost:5433/postgres
          EOF
          docker compose up -d --wait postgres
      - run: just demo-2

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
