name: braian

services:
  postgres:
    image: postgres:18
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
      - -c
      - max_slot_wal_keep_size=10GB
      # Spike 1 compares WAL volume. Compression and a wide checkpoint window
      # keep the forms on the same settings, and keep a checkpoint from landing
      # in the middle of a short run.
      - -c
      - wal_compression=lz4
      - -c
      - default_toast_compression=lz4
      - -c
      - max_wal_size=8GB
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?sätt i .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?sätt i .env}
      POSTGRES_DB: ${POSTGRES_DB:?sätt i .env}
      POSTGRES_READONLY_PASSWORD: ${POSTGRES_READONLY_PASSWORD:?sätt i .env}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.6
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "19092:19092"
      - "18081:18081"
      - "19644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 5s
      timeout: 5s
      retries: 30

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.13.1
    environment:
      KAFKA_BROKERS: redpanda:9092
      SCHEMAREGISTRY_ENABLED: "true"
      SCHEMAREGISTRY_URLS: http://redpanda:8081
      REDPANDA_ADMINAPI_ENABLED: "true"
      REDPANDA_ADMINAPI_URLS: http://redpanda:9644
    ports:
      - "8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  # Samma Kafka-API som Redpanda. `docker compose --profile kafka up -d kafka`
  # och KAFKA_BROKERS=localhost:19093 kör relay-testet mot Apache Kafka.
  kafka:
    profiles: ["kafka"]
    image: apache/kafka:3.9.1
    ports:
      - "19093:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:19093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"

  typesense:
    image: typesense/typesense:30.2
    command:
      - --data-dir=/data
      - --api-key=${TYPESENSE_API_KEY:?sätt i .env}
      - --enable-cors
    ports:
      - "8108:8108"
    volumes:
      - typesense-data:/data

volumes:
  postgres-data:
  redpanda-data:
  typesense-data:
  # Import files are spooled on the API host (BRAIAN_IMPORT_DIR, default ./data/imports).
  # There is no API service in this file yet; mount that directory when one is added.
