name: openpim

services:
  postgres:
    image: postgres:18
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
      - -c
      - max_slot_wal_keep_size=10GB
      # Spike 1 compares WAL volume. Compression and a wide checkpoint window
      # keep the forms on the same settings, and keep a checkpoint from landing
      # in the middle of a short run.
      - -c
      - wal_compression=lz4
      - -c
      - default_toast_compression=lz4
      - -c
      - max_wal_size=8GB
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?sätt i .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?sätt i .env}
      POSTGRES_DB: ${POSTGRES_DB:?sätt i .env}
      POSTGRES_READONLY_PASSWORD: ${POSTGRES_READONLY_PASSWORD:?sätt i .env}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.6
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "19092:19092"
      - "18081:18081"
      - "19644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 5s
      timeout: 5s
      retries: 30

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.13.1
    environment:
      KAFKA_BROKERS: redpanda:9092
      SCHEMAREGISTRY_ENABLED: "true"
      SCHEMAREGISTRY_URLS: http://redpanda:8081
      REDPANDA_ADMINAPI_ENABLED: "true"
      REDPANDA_ADMINAPI_URLS: http://redpanda:9644
    ports:
      - "8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  typesense:
    image: typesense/typesense:30.2
    command:
      - --data-dir=/data
      - --api-key=${TYPESENSE_API_KEY:?sätt i .env}
      - --enable-cors
    ports:
      - "8108:8108"
    volumes:
      - typesense-data:/data

volumes:
  postgres-data:
  redpanda-data:
  typesense-data:
