[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
publish = false

[workspace.dependencies]
openpim-model = { path = "crates/model" }
openpim-rules = { path = "crates/rules" }
openpim-store = { path = "crates/store" }
openpim-events = { path = "crates/events" }
openpim-search = { path = "crates/search" }
openpim-api = { path = "crates/api" }
openpim-relay = { path = "crates/relay" }
openpim-indexer = { path = "crates/indexer" }

anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
