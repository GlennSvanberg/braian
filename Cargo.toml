[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
publish = false

[workspace.dependencies]
openpim-model = { path = "crates/model" }
openpim-rules = { path = "crates/rules" }
openpim-store = { path = "crates/store" }
openpim-events = { path = "crates/events" }
openpim-search = { path = "crates/search" }
openpim-api = { path = "crates/api" }
openpim-relay = { path = "crates/relay" }
openpim-indexer = { path = "crates/indexer" }

anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
proptest = "1"
rand = "0.10"
rand_chacha = "0.10"
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", default-features = false, features = ["std", "serde"] }
# Keep this in lockstep with wasm-bindgen-cli in the devcontainer, justfile and CI.
wasm-bindgen = "=0.2.129"
