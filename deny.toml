[graph]
all-features = true

[licenses]
# Braian itself is Apache-2.0 (LICENSE and NOTICE).
# This list is the licenses accepted for dependencies.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # CA bundle shipped by webpki-roots (reqwest rustls). Permissive data license.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
